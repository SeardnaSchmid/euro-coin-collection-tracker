# Cuts a GitHub release from a v* tag and attaches the built site as a zip.
# Publishing to Pages is deploy.yml's job and runs independently off main.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Release notes are generated by diffing against the previous tag,
          # so the shallow default clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # The site is ~70 MB of coin images, so the asset is a zip of dist/
      # rather than a single bundled file. Unzip it anywhere and serve it
      # statically: vite's base is "./", so no host path is baked in.
      - name: Package dist
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          (cd dist && zip -qr "../eurocase-${tag}.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "eurocase-${tag}.zip"
